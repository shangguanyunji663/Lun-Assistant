# ============================================================
# 工具治理配置：限流阈值 / 互斥锁 / 降级默认参数 / 熔断分组
# ============================================================
tools:
  topic_analysis:
    rate_limit_rpm: 10
    breaker: llm_main

  search_literature:
    rate_limit_rpm: 20
    breaker: rag_pipeline
    fallback_kwargs: {top_k: 5}

  rewrite_query:
    rate_limit_rpm: 60
    breaker: llm_light

  classify_intent:
    rate_limit_rpm: 120
    breaker: llm_light

  generate_section:
    rate_limit_rpm: 10
    breaker: llm_main

  check_format:
    rate_limit_rpm: 15
    breaker: llm_main
    fallback_kwargs: {strict: false}

  check_plagiarism:
    rate_limit_rpm: 10
    breaker: rag_pipeline
    fallback_kwargs: {granularity: paragraph}

  detect_ai_text:
    rate_limit_rpm: 10
    breaker: llm_main
    fallback_kwargs: {mode: fast}

  generate_artifact:
    rate_limit_rpm: 6
    breaker: llm_main
    fallback_kwargs: {kind: review_draft}

  # ---- P2 学术工具生态 ----
  translate_academic:
    rate_limit_rpm: 15
    breaker: llm_main

  polish_academic:
    rate_limit_rpm: 15
    breaker: llm_main

  recommend_method:
    rate_limit_rpm: 15
    breaker: rag_pipeline
    fallback_kwargs: {question: 如何选择研究方法}

  format_reference:
    rate_limit_rpm: 60
    breaker: default
    fallback_kwargs: {style: gb7714}

  generate_abstract:
    rate_limit_rpm: 10
    breaker: llm_main
    fallback_kwargs: {length: 200}

  term_explain:
    rate_limit_rpm: 20
    breaker: rag_pipeline

  ingest_corpus:
    rate_limit_rpm: 2
    lock_key: task:ingest
    breaker: rag_pipeline

  admin_reindex:
    rate_limit_rpm: 2
    lock_key: task:reindex
    breaker: rag_pipeline
