# ============================================================
# 论匠（LunJiang）统一配置
# 所有模块从此处读取配置；${VAR} 表示从 .env / 环境变量插值
# ============================================================

app:
  name: lunjiang
  host: ${APP_HOST}
  port: ${APP_PORT}
  debug: ${APP_DEBUG}
  secret_key: ${SECRET_KEY}

# ------------------------------------------------------------
# LLM 统一接入：切换 default_provider 即可一键换对话底座（均走 OpenAI 兼容协议）
# embedding_provider 可与对话底座分离（如：云端对话 + 本地 bge-m3 嵌入）
# ------------------------------------------------------------
llm:
  default_provider: agnes         # 对话底座：agnes-2.5-flash（云端，KEY 在 .env）
  embedding_provider: ollama      # 嵌入底座：bge-m3（本地，离线可用）
  timeout:
    chat: 60           # 非流式对话超时（秒）
    chat_stream: 90    # 流式对话超时（秒）
    embedding: 45      # 嵌入调用超时（秒）
  providers:
    ollama:
      base_url: http://127.0.0.1:11434/v1
      api_key: ollama
      chat_model: qwen3:4b-ctx4096   # 固定 num_ctx=4096 的镜像（ollama create，见 README/OLLAMA 适配）
      embedding_model: bge-m3
      embedding_dim: 1024
      temperature: 0.7
    deepseek:
      base_url: https://api.deepseek.com/v1
      api_key: ${DEEPSEEK_API_KEY}
      chat_model: deepseek-chat
      embedding_model: ""
      embedding_dim: 0
      temperature: 0.7
    zhipu:
      base_url: https://open.bigmodel.cn/api/paas/v4
      api_key: ${ZHIPU_API_KEY}
      chat_model: glm-4-flash
      embedding_model: embedding-3
      embedding_dim: 2048
      temperature: 0.7
    qwen:
      base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
      api_key: ${QWEN_API_KEY}
      chat_model: qwen-plus
      embedding_model: text-embedding-v3
      embedding_dim: 1024
      temperature: 0.7
    # 云上高性能备选（OpenAI 兼容 /chat/completions）：本地 qwen3:4b 能力不足时切换
    agnes:
      base_url: ${AGNES_BASE_URL}
      api_key: ${AGNES_API_KEY}
      chat_model: agnes-2.5-flash
      embedding_model: ""
      embedding_dim: 0
      temperature: 0.7

# 交叉编码器精排（本地 sentence-transformers 加载）
rerank:
  model: BAAI/bge-reranker-base
  device: cpu
  max_length: 512

# ------------------------------------------------------------
# 存储
# ------------------------------------------------------------
storage:
  postgres:
    async_dsn: postgresql+asyncpg://${PG_USER}:${PG_PASSWORD}@${PG_HOST}:${PG_PORT}/${PG_DB}
    sync_dsn: postgresql://${PG_USER}:${PG_PASSWORD}@${PG_HOST}:${PG_PORT}/${PG_DB}
  redis:
    url: redis://${REDIS_HOST}:${REDIS_PORT}/${REDIS_DB}

# ------------------------------------------------------------
# Agent 编排
# ------------------------------------------------------------
agent:
  max_hops: 3                       # 单轮会话最大调度跳数（防回环）

# ------------------------------------------------------------
# 记忆与压缩
# ------------------------------------------------------------
memory:
  short_term_max_turns: 20          # 短期对话窗口保留轮数
  compress_trigger_tokens: 3000     # 状态体积触发压缩阈值
  target_compression_ratio: 0.3     # 四级压缩目标：压至原始30%以内
  preference_top_k: 10              # 用户偏好召回条数
  recall_semantic_weight: 0.7       # 长期记忆召回：语义距离权重（0~1，越大越偏距离，importance 为次因子）

# ------------------------------------------------------------
# RAG 三阶段递进检索
# ------------------------------------------------------------
rag:
  rewrite_enabled: true             # 阶段1：Query改写总开关（false 时恒为 idle）
  rewrite_mode: auto                # 改写模式: off=关闭 / auto=按查询难度自适应(默认) / on=强制LLM
                                    # auto: 简单短句查询跳过LLM仅规则关键词(strategy=skip)，口语化长尾才走LLM
  recall_top_k: 20                  # 阶段2：双路混合召回（dense+bm25 各取）
  final_top_k: 5                    # 阶段3：精排后保留
  chunk_size: 512
  chunk_overlap: 64
  recall_target_at5: 0.9            # 验收指标 Recall@5 目标
  sibling_window: 1                 # 第三引擎：命中块相邻窗口扩展半径（0=关闭）
  max_upload_size_mb: 20            # 知识库单文件大小上限
  # 项目级私有知识库：分块复用 chunk_size/overlap，原始文件落盘目录
  knowledge:
    upload_dir: data/uploads
    min_text_chars: 30              # 低于此字符数视为"无可提取文本"（扫描件）

# ------------------------------------------------------------
# 治理与风控
# ------------------------------------------------------------
governance:
  rate_limit:
    default_rpm: 30                 # Redis 滑动窗口默认每分钟请求数
    burst: 10
  retry:
    max_attempts: 3                 # 指数退避重试
    base_delay: 0.5
    max_delay: 8.0
    per_call_timeout_s: 120         # 单次工具调用总超时天花板（秒，含 LLM+检索+精排）
  circuit_breaker:
    failure_threshold: 5            # 连续失败阈值 → OPEN
    recovery_timeout: 30            # OPEN→HALF_OPEN 等待秒数
    half_open_successes: 2          # HALF_OPEN 恢复所需成功数
  skill:
    pattern_threshold: 3            # 同模式累计3次自动沉淀 Skill
  lock:
    ttl_seconds: 300                # 分布式锁默认TTL
  audit:
    sanitize_chars: 200             # 审计参数合规：超该字符数的字符串截断为 指纹+摘要+长度（R13）
                                    # 硬约束：审计不存整段正文，仅留 sha256 指纹供对账

# ------------------------------------------------------------
# 可观测与评测
# ------------------------------------------------------------
observability:
  trace_enabled: true
  slow_span_ms: 2000                # 慢调用阈值

evals:
  dataset_dir: evals/datasets
  ab_prompts_dir: evals/prompts
