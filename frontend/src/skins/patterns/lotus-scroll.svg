<svg xmlns="http://www.w3.org/2000/svg" width="240" height="180" viewBox="0 0 240 180">
  <title>缠枝莲 · 自主重构版</title>
  <desc>
    依传统缠枝莲纹三条造型规律自主重构，非复刻任何具体文物图样：
    ① 枝茎作「切圆式」转折——主蔓走半圆弧，与分枝穿插形成切圆空间；
    ② 莲花突出中心莲蓬，花瓣取九片（传统区间 8–12）；
    ③ 叶片三歧分叉，尺寸约为花头径的三分之一。
    构图遵「同花异向」：相邻两朵莲花在藤蔓中呈相反朝向，使循环中保持变化。
    主蔓在左右边界等高收笔，可无缝平铺；坐标与线宽为手工设定，未用程序化对称或随机。
  </desc>
