<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>彩蛋 · 其三 · 临帖墨试</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@700;900&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
  /* ============================================================
     彩蛋其三 · 临帖墨试
     美术方向：秋香宣纸（工作台 g 主题同源）
     宣纸 #E6DECB / 茶褐 #A0824A / 墨 #2E2A20 / 朱印 #9E3B2C
     大留白 · 竖排题签 · 米字格朱线 · 印章式按钮 · 落款钤印
     ============================================================ */
  :root {
    --paper: #E6DECB; --scroll: #F7F3E8; --ink: #2E2A20; --mid: #5C5546; --low: #8A846F;
    --accent: #A0824A; --seal: #9E3B2C; --line: rgba(46, 42, 32, 0.18);
    --serif: "Noto Serif SC", "Source Han Serif SC", "Songti SC", SimSun, serif;
    --mono: "IBM Plex Mono", Consolas, monospace;
    --sans: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--sans); overflow: hidden; }
  body::before { content: ''; position: fixed; inset: 0; pointer-events: none; z-index: 0; opacity: 0.5;
    background-image:
      repeating-linear-gradient(94deg, transparent 0 3px, rgba(46, 42, 32, 0.025) 3px 4px),
      repeating-linear-gradient(2deg, transparent 0 5px, rgba(160, 130, 74, 0.05) 5px 6px); }

  .top { position: relative; z-index: 2; display: flex; align-items: center; gap: 16px; padding: 0 26px; min-height: 58px; }
  .top .tag { font-family: var(--serif); font-weight: 900; font-size: 17px; letter-spacing: 0.3em; }
  .top .no { font-family: var(--mono); font-size: 10px; letter-spacing: 0.16em; color: var(--scroll);
    background: var(--seal); padding: 4px 8px; }
  .top nav { margin-left: auto; display: flex; gap: 14px; }
  .top nav a { font-family: var(--mono); font-size: 11px; letter-spacing: 0.1em; color: var(--mid); text-decoration: none;
    border-bottom: 1px solid var(--accent); padding: 4px 2px; }
  .top nav a:hover { color: var(--seal); border-color: var(--seal); }

  main { position: relative; z-index: 1; height: calc(100% - 58px); display: flex; gap: 30px; padding: 16px 40px 26px 26px; align-items: stretch; }

  /* 册页（画布） */
  .stage { flex: 1; display: flex; align-items: center; justify-content: center; }
  .pad { position: relative; width: min(60vh, 600px, 100%); aspect-ratio: 1 / 1;
    background: var(--scroll); padding: 14px; box-shadow: 0 14px 40px rgba(46, 42, 32, 0.18); }
  .pad::after { content: ''; position: absolute; inset: 0; pointer-events: none; border: 1px solid rgba(158, 59, 44, 0.25); }
  .pad canvas { position: absolute; inset: 14px; width: calc(100% - 28px); height: calc(100% - 28px); }
  #ink { touch-action: none; cursor: crosshair; }
  .pad .corner { position: absolute; right: 22px; bottom: 18px; font-family: var(--mono); font-size: 10px;
    letter-spacing: 0.14em; color: var(--low); pointer-events: none; }

  /* 侧栏：竖排题签 + 卷面信息 */
  .side { width: 330px; flex: none; display: flex; gap: 22px; }
  .tick { writing-mode: vertical-rl; font-family: var(--serif); font-weight: 900; font-size: 34px; letter-spacing: 0.34em;
    color: var(--ink); border-right: 1px solid rgba(158, 59, 44, 0.4); padding: 6px 12px 6px 0; }
  .tick small { font-family: var(--mono); font-size: 10px; letter-spacing: 0.24em; color: var(--accent); font-weight: 400; }
  .body { flex: 1; display: flex; flex-direction: column; gap: 18px; padding-top: 4px; }
  .body h2 { margin: 0; font-family: var(--serif); font-weight: 900; font-size: 22px; letter-spacing: 0.08em; }
  .body .desc { margin: 0; color: var(--mid); font-size: 13px; line-height: 2.05; }
  .body .desc b { color: var(--ink); }

  .meter { display: flex; flex-direction: column; gap: 7px; }
  .meter .row { display: flex; justify-content: space-between; align-items: baseline; }
  .meter .k { font-family: var(--mono); font-size: 9.5px; letter-spacing: 0.18em; color: var(--low); }
  .meter b { font-family: var(--mono); font-size: 18px; font-weight: 500; }
  .meter .track { height: 5px; background: rgba(46, 42, 32, 0.14); }
  .meter .fill { height: 100%; width: 0; background: var(--accent); transition: width 0.2s ease; }
  .meter .fill.warn { background: var(--seal); }

  /* 印章式按钮 */
  .seals { display: flex; gap: 12px; }
  .sbtn { width: 62px; height: 66px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px;
    border: 2px solid var(--seal); color: var(--seal); background: rgba(158, 59, 44, 0.05); cursor: pointer;
    font-family: var(--serif); font-weight: 900; font-size: 16px; line-height: 1.15; letter-spacing: 0.05em; user-select: none; }
  .sbtn:hover { background: var(--seal); color: var(--scroll); }
  .sbtn.ready { animation: glow 1.2s ease infinite; }
  @keyframes glow { 50% { box-shadow: 0 0 0 6px rgba(158, 59, 44, 0.18); } }
  .notes { margin: 0; padding: 0; list-style: none; color: var(--low); font-size: 11.5px; line-height: 2; }
  .notes li::before { content: '· '; color: var(--accent); }
  #hint { color: var(--mid); font-size: 12px; min-height: 20px; }

  /* 结算 */
  .overlay { position: fixed; inset: 0; z-index: 80; background: rgba(230, 222, 203, 0.94); display: flex; align-items: center; justify-content: center; }
  .overlay.hide { display: none; }
  .panel { width: min(680px, 93vw); background: var(--scroll); padding: 30px 38px; box-shadow: 0 22px 60px rgba(46, 42, 32, 0.22);
    border-top: 1px solid rgba(158, 59, 44, 0.5); border-bottom: 1px solid rgba(158, 59, 44, 0.5); }
  .kicker { margin: 0 0 10px; font-family: var(--mono); font-size: 10px; letter-spacing: 0.34em; color: var(--seal); }
  .rank { display: flex; align-items: center; gap: 20px; margin: 8px 0 18px; }
  .seal-big { width: 84px; height: 84px; flex: none; background: var(--seal); color: #F7F3E8; border-radius: 4px;
    display: flex; align-items: center; justify-content: center; font-family: var(--serif); font-size: 46px; font-weight: 900;
    box-shadow: inset 0 0 0 3px rgba(247, 243, 232, 0.5); animation: stamp 0.5s cubic-bezier(0.2, 1.6, 0.4, 1); }
  @keyframes stamp { from { transform: scale(2.1) rotate(-14deg); opacity: 0; } }
  .rank b { display: block; font-family: var(--serif); font-size: 25px; letter-spacing: 0.12em; }
  .rank span { display: block; margin-top: 5px; color: var(--low); font-size: 12.5px; }
  .artwrap { display: flex; gap: 22px; align-items: center; margin-bottom: 20px; }
  .artwrap img { width: 216px; height: 216px; background: #F7F3E8; box-shadow: 0 12px 30px rgba(46, 42, 32, 0.16); }
  .stats { list-style: none; margin: 0; padding: 0; flex: 1; }
  .stats li { display: flex; justify-content: space-between; padding: 9px 2px; border-bottom: 1px solid var(--line); font-size: 13px; color: var(--mid); }
  .stats b { font-family: var(--mono); font-weight: 500; color: var(--ink); }
  .actions { display: flex; gap: 12px; flex-wrap: wrap; }
  .btn { font-family: var(--sans); font-size: 13px; text-decoration: none; padding: 10px 20px; cursor: pointer;
    border: 1px solid var(--line); color: var(--mid); background: none; letter-spacing: 0.08em; }
  .btn:hover { border-color: var(--accent); color: var(--ink); }
  .btn.ink { background: var(--seal); color: #F7F3E8; border-color: var(--seal); }
  .btn.ink:hover { background: #B8483A; }

  @media (max-width: 940px) {
    main { flex-direction: column; overflow: auto; padding: 10px 18px 22px; }
    .side { width: 100%; }
    .tick { display: none; }
    .pad { width: min(86vw, 520px); }
  }
</style>
</head>
<body>

<header class="top">
  <span class="tag">临帖墨试</span>
  <span class="no">彩蛋 其三 / 叁</span>
  <nav>
    <a href="../index.html">返回门面</a>
    <a href="../app.html">进入工作台</a>
  </nav>
</header>

<main>
  <div class="stage">
    <div class="pad">
      <canvas id="guide" width="620" height="620"></canvas>
      <canvas id="ink" width="620" height="620"></canvas>
      <span class="corner" id="charTag">临帖 · 匠</span>
    </div>
  </div>

  <aside class="side">
    <div class="tick">临帖墨试<small>　LUNJIANG EASTER 03</small></div>
    <div class="body">
      <h2>把这一字写完</h2>
      <p class="desc">按住拖动运笔，沿淡墨字帖填墨。<b>覆盖越高、出墨越少，评价越高</b>——习作、能品、妙品、神品。</p>

      <div class="meter">
        <div class="row"><span class="k">COVERAGE · 覆盖</span><b id="cov">0%</b></div>
        <div class="track"><div class="fill" id="covBar"></div></div>
        <div class="row" style="margin-top:10px"><span class="k">SPILL · 出墨（越少越好）</span><b id="spill">0%</b></div>
        <div class="track"><div class="fill warn" id="spillBar"></div></div>
      </div>
      <p id="hint">落笔吧——慢一点，稳一点。</p>

      <div class="seals">
        <button class="sbtn" id="finish" type="button">收<span>笔</span></button>
        <button class="sbtn" id="clear" type="button">清<span>纸</span></button>
        <button class="sbtn" id="next" type="button">换<span>字</span></button>
      </div>

      <ul class="notes">
        <li>覆盖＝墨落在字内的比例；出墨＝笔画飞出字外的比例。</li>
        <li>评定后墨迹与朱印一并裱起，可保存为作品。</li>
      </ul>
    </div>
  </aside>
</main>

<div class="overlay hide" id="endOv">
  <div class="panel">
    <p class="kicker">RESULT · 墨试评定</p>
    <div class="rank">
      <div class="seal-big" id="rankSeal">妙</div>
      <div><b id="rankName">妙品</b><span id="rankLine"></span></div>
    </div>
    <div class="artwrap">
      <img id="art" alt="你的墨迹" />
      <ul class="stats">
        <li><span>临字</span><b id="fChar">匠</b></li>
        <li><span>覆盖</span><b id="fCov">0%</b></li>
        <li><span>出墨</span><b id="fSpill">0%</b></li>
        <li><span>综合得分</span><b id="fScore">0</b></li>
      </ul>
    </div>
    <div class="actions">
      <button class="btn ink" id="againBtn" type="button">再临一字</button>
      <a class="btn" id="saveArt" download="论匠·临帖.png">保存作品</a>
      <a class="btn" href="../index.html">返回门面</a>
    </div>
  </div>
</div>

<script>
(function () {
  'use strict'
  var S = 620
  var CHARS = ['匠', '论', '墨', '砚', '书', '文']
  var ci = 0

  var guide = document.getElementById('guide')
  var gctx = guide.getContext('2d')
  var inkC = document.getElementById('ink')
  var ictx = inkC.getContext('2d')
  var endOv = document.getElementById('endOv')

  var maskC = document.createElement('canvas'); maskC.width = maskC.height = S
  var mctx = maskC.getContext('2d')
  var dilC = document.createElement('canvas'); dilC.width = dilC.height = S
  var dctx = dilC.getContext('2d')

  var glyphSamples = 0
  var dilAlpha = null
  var cov = 0, spill = 0
  var drawing = false, last = null, lastT = 0

  var $ = function (id) { return document.getElementById(id) }

  function drawGlyph(ctx, ch, style, dx, dy) {
    ctx.save()
    ctx.font = '900 430px "Noto Serif SC","Songti SC",SimSun,serif'
    ctx.textAlign = 'center'
    ctx.textBaseline = 'middle'
    ctx.fillStyle = style
    ctx.fillText(ch, S / 2 + (dx || 0), S / 2 + 12 + (dy || 0))
    ctx.restore()
  }
  function buildMasks(ch) {
    mctx.clearRect(0, 0, S, S)
    drawGlyph(mctx, ch, '#fff', 0, 0)
    dctx.clearRect(0, 0, S, S)
    var r = 11
    for (var a = 0; a < 8; a++) {
      var ang = a * Math.PI / 4
      drawGlyph(dctx, ch, '#fff', Math.cos(ang) * r, Math.sin(ang) * r)
    }
    var core = mctx.getImageData(0, 0, S, S).data
    dilAlpha = dctx.getImageData(0, 0, S, S).data
    glyphSamples = 0
    for (var i = 3; i < core.length; i += 8) { if (core[i] > 40) glyphSamples += 1 }
    /* 字帖层：米字格（淡朱）+ 淡墨字 */
    gctx.clearRect(0, 0, S, S)
    gctx.strokeStyle = 'rgba(158, 59, 44, 0.18)'
    gctx.lineWidth = 1
    gctx.setLineDash([7, 7])
    gctx.beginPath()
    gctx.moveTo(S / 2, 10); gctx.lineTo(S / 2, S - 10)
    gctx.moveTo(10, S / 2); gctx.lineTo(S - 10, S / 2)
    gctx.moveTo(20, 20); gctx.lineTo(S - 20, S - 20)
    gctx.moveTo(S - 20, 20); gctx.lineTo(20, S - 20)
    gctx.stroke()
    gctx.setLineDash([])
    gctx.strokeStyle = 'rgba(160, 130, 74, 0.5)'
    gctx.strokeRect(9.5, 9.5, S - 19, S - 19)
    drawGlyph(gctx, ch, 'rgba(46, 42, 32, 0.13)', 0, 0)
    $('charTag').textContent = '临帖 · ' + ch
  }

  function evaluate() {
    if (!dilAlpha || !glyphSamples) return { cov: 0, spill: 0 }
    var d = ictx.getImageData(0, 0, S, S).data
    var total = 0, inside = 0
    for (var i = 3; i < d.length; i += 8) {
      if (d[i] > 40) {
        total += 1
        if (dilAlpha[i] > 40) inside += 1
      }
    }
    var c = Math.min(1, inside / glyphSamples)
    var sp = total ? (total - inside) / total : 0
    return { cov: c, spill: sp }
  }
  function refreshMeters() {
    var r = evaluate()
    cov = r.cov; spill = r.spill
    $('cov').textContent = Math.round(cov * 100) + '%'
    $('covBar').style.width = (cov * 100) + '%'
    $('spill').textContent = Math.round(spill * 100) + '%'
    $('spillBar').style.width = Math.min(100, spill * 160) + '%'
    var fin = $('finish')
    if (cov >= 0.85) {
      $('hint').textContent = '覆盖已够——可以收笔评定了。'
      fin.classList.add('ready')
    } else if (spill > 0.25) {
      $('hint').textContent = '出墨有点多，收着点笔锋。'
      fin.classList.remove('ready')
    } else {
      $('hint').textContent = '继续填墨：先把主线写满。'
      fin.classList.remove('ready')
    }
  }

  function toCanvas(e) {
    var r = inkC.getBoundingClientRect()
    return { x: (e.clientX - r.left) * (S / r.width), y: (e.clientY - r.top) * (S / r.height) }
  }
  ictx.lineCap = 'round'
  ictx.lineJoin = 'round'
  ictx.strokeStyle = 'rgba(38, 34, 26, 0.90)'
  inkC.addEventListener('pointerdown', function (e) {
    drawing = true
    last = toCanvas(e)
    lastT = performance.now()
    try { inkC.setPointerCapture(e.pointerId) } catch (err) { /* 忽略 */ }
    ictx.lineWidth = 24
    ictx.beginPath()
    ictx.moveTo(last.x, last.y)
    ictx.lineTo(last.x + 0.1, last.y)
    ictx.stroke()
  })
  inkC.addEventListener('pointermove', function (e) {
    if (!drawing) return
    var p = toCanvas(e)
    var now = performance.now()
    var dist = Math.hypot(p.x - last.x, p.y - last.y)
    var speed = dist / Math.max(1, now - lastT)
    ictx.lineWidth = Math.max(13, Math.min(26, 26 - speed * 0.9))
    ictx.beginPath()
    ictx.moveTo(last.x, last.y)
    ictx.quadraticCurveTo(last.x, last.y, (last.x + p.x) / 2, (last.y + p.y) / 2)
    ictx.stroke()
    last = p; lastT = now
  })
  inkC.addEventListener('pointerup', function () { drawing = false; last = null; refreshMeters() })
  inkC.addEventListener('pointercancel', function () { drawing = false; last = null; refreshMeters() })

  /* 作品裱装：宣纸底 + 淡字 + 墨迹 + 朱印 */
  function composeArt(ch, withSeal) {
    var out = document.createElement('canvas'); out.width = out.height = S
    var c = out.getContext('2d')
    c.fillStyle = '#F7F3E8'; c.fillRect(0, 0, S, S)
    drawGlyph(c, ch, 'rgba(46, 42, 32, 0.09)', 0, 0)
    c.drawImage(inkC, 0, 0)
    c.strokeStyle = 'rgba(160, 130, 74, 0.55)'
    c.lineWidth = 1
    c.strokeRect(10.5, 10.5, S - 21, S - 21)
    if (withSeal) {
      c.save()
      c.fillStyle = 'rgba(158, 59, 44, 0.92)'
      c.fillRect(S - 108, S - 108, 66, 66)
      c.strokeStyle = 'rgba(247, 243, 232, 0.75)'
      c.lineWidth = 2.5
      c.strokeRect(S - 103, S - 103, 56, 56)
      c.fillStyle = '#F7F3E8'
      c.font = '900 40px "Noto Serif SC","KaiTi",serif'
      c.textAlign = 'center'; c.textBaseline = 'middle'
      c.fillText('论', S - 75, S - 72)
      c.restore()
    }
    return out.toDataURL('image/png')
  }
  function finish() {
    var r = evaluate()
    cov = r.cov; spill = r.spill
    var score = Math.round(Math.max(0, Math.min(100, cov * 100 - spill * 120)))
    var rank = score >= 88 ? ['神品', '神'] : score >= 72 ? ['妙品', '妙'] : score >= 52 ? ['能品', '能'] : ['习作', '习']
    var ch = CHARS[ci]
    $('rankSeal').textContent = rank[1]
    $('rankName').textContent = rank[0]
    $('rankLine').textContent = '「' + ch + '」字 · 综合 ' + score + ' 分'
    $('fChar').textContent = ch
    $('fCov').textContent = Math.round(cov * 100) + '%'
    $('fSpill').textContent = Math.round(spill * 100) + '%'
    $('fScore').textContent = String(score)
    var url = composeArt(ch, score >= 52)
    $('art').src = url
    $('saveArt').href = url
    $('saveArt').download = '论匠·临帖·' + ch + '.png'
    endOv.classList.remove('hide')
  }
  function clearInk() {
    ictx.clearRect(0, 0, S, S)
    refreshMeters()
  }
  function nextChar() {
    ci = (ci + 1) % CHARS.length
    clearInk()
    buildMasks(CHARS[ci])
  }
  $('finish').addEventListener('click', finish)
  $('clear').addEventListener('click', clearInk)
  $('next').addEventListener('click', nextChar)
  $('againBtn').addEventListener('click', function () { endOv.classList.add('hide'); nextChar() })

  function boot() {
    buildMasks(CHARS[ci])
    setInterval(refreshMeters, 350)
  }
  try {
    var p = document.fonts.load('900 430px "Noto Serif SC"', CHARS.join(''))
    if (p && p.then) { p.then(function () { return document.fonts.ready }).then(boot).catch(boot) } else { boot() }
  } catch (e) { boot() }
})()
</script>
</body>
</html>
