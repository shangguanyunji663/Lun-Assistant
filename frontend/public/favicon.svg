<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- 论匠品牌印章 favicon：与皮肤 A 的印章同源（朱底 + 纸色字），
       匠字用衬线黑体渲染，浏览器无 Noto Serif SC 时退宋体，气质不变 -->
  <rect width="64" height="64" rx="13" fill="#C0332A"/>
  <text x="32" y="47"
        font-family="'Noto Serif SC','Source Han Serif SC','Songti SC',SimSun,serif"
        font-size="40" font-weight="900" fill="#F3EEE3"
        text-anchor="middle">匠</text>
</svg>
