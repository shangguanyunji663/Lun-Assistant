<!doctype html>
<html lang="zh-CN" data-skin="a">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#E8E3D8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <!-- 字体自托管：见 src/fonts/fonts.css（替代 fonts.googleapis.com，内网不掉字重） -->
    <link rel="stylesheet" href="/src/fonts/fonts.css" />
    <meta name="description" content="论匠 · 多智能体论文全流程工作台 —— 六套设计语言可切换" />
    <title>论匠 · 工作台</title>
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="论匠 LunJiang" />
    <meta property="og:title" content="论匠 · 工作台" />
    <meta property="og:description" content="论匠 · 多智能体论文全流程工作台 —— 六套设计语言可切换。" />
    <!-- 首帧前把皮肤属性就位（读 localStorage.lj_skin），否则会闪一帧默认皮肤。
        脚本被禁用时保持模板里的 data-skin="a"，功能不受影响。 -->
    <script>
      try {
        var s = localStorage.getItem('lj_skin')
        if (!/^[a-h]$/.test(s || '')) s = 'a'
        document.documentElement.setAttribute('data-skin', s)
      } catch (e) { /* 隐私模式：保持模板默认 */ }
    </script>
    <!-- 六套皮肤共用的三档字族：宋（A/D/F 标题）、黑（全皮肤正文）、等宽（标注与数据） -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
